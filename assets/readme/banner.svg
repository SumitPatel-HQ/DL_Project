<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Keyword Spotting</title>
  <desc id="desc">An LSTM speech project for audio analysis, live voice control, and model evaluation.</desc>
